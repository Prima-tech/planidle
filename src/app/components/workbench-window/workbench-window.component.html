<div class="wbw-root">
  <div class="wbw-title">{{ 'WORKBENCH.TITLE' | translate }}</div>

  <!-- Pestañas por tipo. La que esconde una receta de la guía brilla. -->
  <div class="wbw-tabs" role="tablist">
    <button *ngFor="let k of KINDS" type="button" role="tab" class="wbw-tab"
            [class.active]="kind === k.key"
            [class.guide-glow]="kind !== k.key && kindHasGuide(k.key)"
            [attr.aria-selected]="kind === k.key" (click)="setKind(k.key)">
      <ion-icon [name]="k.icon"></ion-icon>
      <span>{{ k.label | translate }}</span>
    </button>
  </div>

  <!-- Recetas de la pestaña: fichas de 3 en fila con su estado -->
  <div class="wbw-cards">
    <button *ngFor="let r of tabRecipes; trackBy: trackRecipe" type="button" class="wbw-card"
            [class.is-selected]="r.id === selected?.id"
            [class.is-locked]="status(r) === 'locked'"
            [class.guide-glow]="isGuide(r) && wb.canCraft(r)"
            [title]="status(r) === 'locked' ? '' : r.result" (click)="select(r)">
      <span class="wbw-tag" [ngClass]="'wbw-tag--' + status(r)">
        <ion-icon *ngIf="status(r) === 'locked'" name="lock-closed"></ion-icon>
        <ng-container *ngIf="status(r) === 'ready'">{{ 'WORKBENCH.READY' | translate }}</ng-container>
        <ng-container *ngIf="status(r) === 'missing'">{{ 'WORKBENCH.MISSING' | translate }}</ng-container>
      </span>
      <img [src]="wb.iconFor(r.result)" [alt]="r.result" draggable="false" />
      <span class="wbw-card-name">{{ status(r) === 'locked' ? '???' : r.result }}</span>
    </button>
  </div>

  <!-- Barra fija abajo: receta seleccionada, materiales tengo/necesito y Fabricar -->
  <div class="wbw-sheet" *ngIf="selected as r">
    <div class="wbw-sheet-head">
      <span class="wbw-sheet-name">{{ status(r) === 'locked' ? '???' : r.result }}</span>
      <div class="wbw-need" *ngIf="status(r) !== 'locked'">
        <span *ngFor="let c of r.cost" class="wbw-need-item" [class.is-short]="wb.have(c.name) < c.qty" [title]="c.name">
          <img [src]="wb.iconFor(c.name)" [alt]="c.name" />{{ wb.have(c.name) }}/{{ c.qty }}
        </span>
      </div>
    </div>

    <button *ngIf="status(r) !== 'locked'; else locked" type="button" class="rpg-btn rpg-btn--block wbw-craft"
            [disabled]="!wb.canCraft(r)" [class.guide-glow]="isGuide(r) && wb.canCraft(r)" (click)="craft(r)">
      <ion-icon name="hammer"></ion-icon>
      <span>{{ 'WORKBENCH.CRAFT' | translate }}</span>
    </button>
    <ng-template #locked>
      <div class="wbw-locked">
        <ion-icon name="lock-closed"></ion-icon>
        <span>{{ 'WORKBENCH.LOCKED' | translate }}</span>
      </div>
    </ng-template>
  </div>
</div>
