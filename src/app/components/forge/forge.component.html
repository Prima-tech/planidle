<div cdkDropListGroup class="forge-root">

  <div class="forge-title">{{ 'BUILD.FORGE_TITLE' | translate }}</div>

  <!-- Pestañas: solo si la mejora de cuenta "Mejoras de forjas" está activa (si no,
       no ocupan sitio y la producción va pegada al título). -->
  <div class="forge-tabs" [class.is-hidden]="!(forgeUpgradesUnlocked$ | async)">
    <button class="forge-tab" [class.is-active]="tab === 'forja'" (click)="setTab('forja')">{{ 'BUILD.FORGE_TAB' | translate }}</button>
    <button class="forge-tab" [class.is-active]="tab === 'mejoras'" (click)="setTab('mejoras')">{{ 'BUILD.FORGE_UPGRADES' | translate }}</button>
  </div>

  <!-- Producir (crisol + bandeja). Arriba: entradas en columna a ras de la izquierda
       (mineral, fuel; sin etiquetas, el icono atenuado ya dice qué va) · crisol que se LLENA de metal con la barra actual · lote a la dcha.
       Debajo: probabilidad de cada rareza y la bandeja de salida (10 huecos; scroll solo
       si se ocupan más de los que caben). Visible si no hay pestañas (bloqueado) o estás
       en la pestaña Forja. -->
  <div class="forge-section forge-prod-section" *ngIf="!(forgeUpgradesUnlocked$ | async) || tab === 'forja'">
    <div class="forge-top">

      <!-- Entradas -->
      <div class="forge-inputs">
        <div class="forge-slot">
          <!-- Mineral: arrastra aquí el mineral. La barra a producir se deduce de él. -->
          <div class="forge-mat-cell" cdkDropList cdkDropListSortingDisabled
               [id]="'forge-mat-0'"
               [cdkDropListConnectedTo]="inventoryCellIds"
               [cdkDropListEnterPredicate]="matEnter"
               (cdkDropListDropped)="onCellDrop($event, 'mat', 0)"
               (click)="onCellClick('mat', 0)">
            <div *ngIf="mat[0]; else matPh" class="forge-item" cdkDrag
                 [cdkDragData]="{ sourceContext: 'forge', grid: 'mat', index: 0, item: mat[0] }"
                 [title]="mat[0].name">
              <ng-container *ngTemplateOutlet="icon; context: { $implicit: mat[0] }"></ng-container>
            </div>
            <ng-template #matPh>
              <img class="forge-cell-ph" src="assets/icon/resources/mining/tier3_drop.png" alt="">
            </ng-template>
          </div>
        </div>

        <div class="forge-slot">
          <div class="forge-fuel-cell" cdkDropList cdkDropListSortingDisabled
               [id]="'forge-fuel-0'"
               [cdkDropListConnectedTo]="inventoryCellIds"
               [cdkDropListEnterPredicate]="fuelEnter"
               (cdkDropListDropped)="onCellDrop($event, 'fuel', 0)"
               (click)="onCellClick('fuel', 0)">
            <div *ngIf="fuel[0]; else fuelPh" class="forge-item" cdkDrag
                 [cdkDragData]="{ sourceContext: 'forge', grid: 'fuel', index: 0, item: fuel[0] }"
                 [title]="fuel[0].name">
              <ng-container *ngTemplateOutlet="icon; context: { $implicit: fuel[0] }"></ng-container>
            </div>
            <ng-template #fuelPh>
              <img class="forge-cell-ph" src="assets/icon/resources/madera.png" alt="">
            </ng-template>
          </div>
        </div>
      </div>

      <!-- Crisol: el metal fundido sube con la unidad actual (#moltenFill, en rAF). -->
      <div class="forge-core">
        <div class="forge-crucible" [class.is-producing]="(running$ | async) && (producing$ | async)">
          <div #moltenFill class="forge-molten"></div>
          <img class="forge-bar-icon" *ngIf="currentBar$ | async as bar" [src]="barIcon(bar)" alt="">
        </div>
        <div class="forge-timer">{{ fmtTime(remaining$ | async) }}</div>
      </div>

      <!-- Lote: barras que quedan con el stock + tiempo y progreso total. -->
      <div class="forge-batch">
        <div class="forge-batch-count">&times;{{ (producible$ | async) || 0 }}</div>
        <div class="forge-timer">{{ fmtTime(totalRemaining$ | async) }}</div>
        <div class="forge-progress forge-progress--total"><span #totalFill></span></div>
      </div>
    </div>

    <!-- Probabilidad de cada rareza al fundir la barra actual (forgeRarityOdds). -->
    <div class="forge-odds">
      <span *ngFor="let o of odds(currentBar$ | async)" [attr.data-rarity]="o.rarity" [style.width.%]="o.pct"></span>
    </div>
    <div class="forge-odds-legend">
      <span *ngFor="let o of odds(currentBar$ | async)" [title]="rarityKey(o.rarity) | translate">
        <i class="forge-odds-dot" [attr.data-rarity]="o.rarity"></i>{{ o.pct }}%
      </span>
    </div>

    <!-- Bandeja de salida: 10 huecos genéricos (cada objeto/rareza distinto en el suyo).
         Se arrastra o doble clic al inventario. Scroll horizontal solo si hay algo más
         allá de los huecos visibles. -->
    <div class="forge-tray" [class.is-scrollable]="outOverflows()">
      <div class="forge-out-cell" *ngFor="let c of out; let i = index; trackBy: trackByIndex"
           cdkDropList cdkDropListSortingDisabled
           [id]="'forge-out-' + i"
           [cdkDropListConnectedTo]="inventoryCellIds"
           [cdkDropListEnterPredicate]="outEnter"
           (cdkDropListDropped)="onCellDrop($event, 'out', i)"
           (click)="onCellClick('out', i)">
        <div *ngIf="c" class="forge-item" cdkDrag
             [attr.data-rarity]="c.rarity || 'common'"
             [cdkDragData]="{ sourceContext: 'forge', grid: 'out', index: i, item: c }"
             [title]="c.name">
          <ng-container *ngTemplateOutlet="icon; context: { $implicit: c }"></ng-container>
        </div>
      </div>
    </div>

    <div class="forge-actions">
      <button class="rpg-btn rpg-btn--sm"
              [class.is-active]="running$ | async"
              [disabled]="!(running$ | async) && !(ready$ | async)"
              (click)="toggle()">
        {{ ((running$ | async) ? 'BUILD.FORGE_PAUSE' : 'BUILD.FORGE_SMELT') | translate }}
      </button>
      <button class="rpg-btn rpg-btn--sm" [disabled]="!hasOutput()" (click)="collectAll()">
        {{ 'BUILD.FORGE_COLLECT' | translate }}
      </button>
    </div>
  </div>

  <!-- Pestaña Mejoras: solo si está desbloqueada y seleccionada. Vacía de momento. -->
  <div class="forge-section forge-upgrades" *ngIf="(forgeUpgradesUnlocked$ | async) && tab === 'mejoras'">
    <div class="forge-upgrades-empty">{{ 'BUILD.FORGE_NO_UPGRADES' | translate }}</div>
  </div>

</div>

<!-- Render del icono de un item (igual que inventario/tienda) -->
<ng-template #icon let-cell>
  <div *ngIf="cell.iconSheet != null" class="item-icon-sheet"
       [style.background-image]="'url(' + cell.iconSheet + ')'"
       [style.background-size]="getSheetBgSize(cell.iconFrameCols, cell.iconFrameSize, cell.iconContentSize)"
       [style.background-position]="getSheetPos(cell.iconFrame, cell.iconFrameCols, cell.iconFrameSize, cell.iconContentSize)"></div>
  <img *ngIf="cell.icon && cell.iconSheet == null" [src]="cell.icon" class="item-icon">
  <span *ngIf="!cell.icon && cell.iconSheet == null" class="item-fallback">{{ cell.name.charAt(0) }}</span>
  <div class="item-sum" *ngIf="cell.sum !== undefined">{{ cell.sum }}</div>
</ng-template>
