<div class="panel-layout">

  <div class="map-area">

    <!-- Info panel (compartido: se rellena al pulsar un pin del globo) -->
    <div class="map-info-card" *ngIf="selectedMap">
      <div class="info-name">{{ selectedMap.name }}</div>
<div class="enemy-grid" *ngIf="selectedMap.spawns.length > 0">
        <div class="info-enemy" *ngFor="let spawn of selectedMap.spawns">
          <div class="enemy-frame">
            <div class="enemy-sprite"
                 [ngStyle]="spriteStyle(spawn.enemyType)"
                 [ngClass]="spriteClass(spawn.enemyType)"></div>
          </div>
        </div>
      </div>

      <!-- Recursos recolectables del mapa (mina/árbol/gema según sus tiers) -->
      <div class="resource-grid" *ngIf="mapResources.length > 0">
        <div class="info-resource" *ngFor="let r of mapResources" [title]="r.type">
          <div class="enemy-frame">
            <img [src]="r.img" class="resource-img" alt="" draggable="false" />
          </div>
        </div>
      </div>

      <div class="info-chars" *ngIf="charsOnMap.length > 0">
        <div class="info-char" *ngFor="let c of charsOnMap" [class.current]="c.isCurrent">
          <div class="enemy-frame char-frame">
            <app-character-sprite [size]="64" [equipmentSnapshot]="c.equipment" [characterName]="c.name"></app-character-sprite>
          </div>
          <span class="info-char-name">{{ c.name }}</span>
        </div>
      </div>

      <button
        *ngIf="canTeleport(selectedMap.id)"
        class="teleport-btn"
        (click)="teleport(selectedMap.id)"
      >
        <ion-icon name="navigate-outline"></ion-icon>
      </button>
      <div class="map-locked-note" *ngIf="isMapLocked(selectedMap.id)">
        <ion-icon name="lock-closed"></ion-icon>
      </div>
    </div>

    <!-- Nombre del planeta en vista detalle (overlay Angular sobre el globo) -->
    <div class="planet-title" *ngIf="detailPlanetName">{{ detailPlanetName }}</div>

    <!-- Capas del globo de la Tierra (mismo terreno en las tres): Normal / Economía /
         Guerra. El botón muestra la inicial del nombre traducido; el nombre entero va
         en el title. -->
    <div
      class="view-tabs"
      [class.raised]="detailPlanetId === 'mundo' && canZoom"
    >
      <ng-container *ngIf="detailPlanetId === 'mundo'">
      <button
        *ngFor="let l of layers"
        class="pml-item view-tab"
        [class.selected]="layer === l.id"
        [title]="l.key | translate"
        (click)="setLayer(l.id)"
      >{{ (l.key | translate).charAt(0) }}</button>
      <!-- Globo ⇄ mapa plano: el icono muestra a qué vista se pasa -->
      <button class="grid-toggle-btn" (click)="toggleFlat()" [title]="(flat ? 'MAP.VIEW_GLOBE' : 'MAP.VIEW_FLAT') | translate">
        <ion-icon [name]="flat ? 'globe-outline' : 'map-outline'"></ion-icon>
      </button>
      <!-- Candado del mapa plano: cerrado = fijo; abierto = arrastrar y zoom -->
      <button
        *ngIf="flat"
        class="grid-toggle-btn"
        [class.active]="!flatLocked"
        (click)="toggleFlatLock()"
        [title]="(flatLocked ? 'MAP.UNLOCK_MAP' : 'MAP.LOCK_MAP') | translate"
      >
        <ion-icon [name]="flatLocked ? 'lock-closed-outline' : 'lock-open-outline'"></ion-icon>
      </button>
      <!-- DEBUG: cuadrícula tx/ty para colocar pines (apagada por defecto) -->
      <button class="grid-toggle-btn" [class.active]="gridOn" (click)="toggleGrid()" [title]="'MAP.GRID' | translate">
        <ion-icon name="grid-outline"></ion-icon>
      </button>
      </ng-container>
      <!-- «+» aleja un nivel (desactivado en la galaxia); «−» acerca un nivel
           (desactivado en el planeta). -->
      <button class="grid-toggle-btn" [disabled]="sceneMode === 'galaxy'" (click)="zoomOutView()" [title]="'MAP.VIEW_ZOOM_OUT' | translate">
        <ion-icon name="add-outline"></ion-icon>
      </button>
      <button class="grid-toggle-btn" [disabled]="sceneMode === 'detail'" (click)="zoomInView()" [title]="'MAP.VIEW_ZOOM_IN' | translate">
        <ion-icon name="remove-outline"></ion-icon>
      </button>
    </div>

    <!-- Barra de zoom del globo (también rueda del ratón y pellizco con dos dedos).
         El mapa plano con el candado cerrado es estático: sin zoom. -->
    <div class="zoom-bar" *ngIf="detailPlanetId === 'mundo' && canZoom">
      <button class="zoom-btn" (click)="stepZoom(-1)" [title]="'MAP.ZOOM_OUT' | translate">
        <ion-icon name="remove-outline"></ion-icon>
      </button>
      <input
        id="globe-zoom"
        class="zoom-range"
        type="range"
        step="0.01"
        [min]="zoomMin"
        [max]="zoomMax"
        [value]="zoom"
        [attr.aria-label]="'MAP.ZOOM' | translate"
        (input)="onZoomInput($event)"
      />
      <button class="zoom-btn" (click)="stepZoom(1)" [title]="'MAP.ZOOM_IN' | translate">
        <ion-icon name="add-outline"></ion-icon>
      </button>
    </div>

    <!-- Planeta interactivo (mini-instancia Phaser propia) -->
    <div class="planet-area" id="planet-view"></div>

    <!-- Columna izquierda («libro de rutas»): una placa metálica; arriba el mapa donde
         estás y debajo, contraíble, el resto de mapas disponibles con su tier y pips de
         dificultad. Pinchar un mapa gira el globo y lo selecciona. -->
    <div class="planet-map-list" *ngIf="planetMapList.length > 0">
      <div class="pml-box" [class.open]="mapListOpen && otherMaps.length > 0">
        <!-- Cabecera = mapa actual (o «Mapas» si no estás en este planeta) -->
        <button class="pml-head" [attr.aria-expanded]="mapListOpen" (click)="toggleMapList()">
          <ion-icon *ngIf="currentEntry" name="location"></ion-icon>
          <span class="pml-name">{{ currentEntry ? currentEntry.name : ('MAP.AVAILABLE_MAPS' | translate) }}</span>
          <span class="pml-tier" *ngIf="currentEntry?.tier">T{{ currentEntry.tier }}</span>
          <ion-icon *ngIf="otherMaps.length > 0" [name]="mapListOpen ? 'chevron-up' : 'chevron-down'"></ion-icon>
        </button>

        <ng-container *ngIf="mapListOpen">
          <button
            *ngFor="let m of otherMaps"
            class="pml-row"
            [class.selected]="selectedMap?.id === m.id"
            (click)="focusPlanetMap(m.id)"
          >
            <span class="pml-name">{{ m.name }}</span>
            <ng-container *ngIf="m.tier">
              <span class="pml-tier">T{{ m.tier }}</span>
              <span class="pml-pips"><i *ngFor="let p of tierPips" [class.on]="p < m.tier"></i></span>
            </ng-container>
          </button>
        </ng-container>
      </div>
    </div>

    <!-- Tarjeta de info del planeta seleccionado -->
    <div class="map-info-card planet-info-card" *ngIf="selectedPlanet">
      <div class="info-name">{{ selectedPlanet.name }}</div>

      <div class="info-chars" *ngIf="charsOnPlanet.length > 0">
        <div class="info-char" *ngFor="let c of charsOnPlanet" [class.current]="c.isCurrent">
          <div class="enemy-frame char-frame">
            <app-character-sprite [size]="64" [equipmentSnapshot]="c.equipment" [characterName]="c.name"></app-character-sprite>
          </div>
          <span class="info-char-name">{{ c.name }}</span>
        </div>
      </div>
      <div class="info-no-enemies" *ngIf="charsOnPlanet.length === 0">{{ 'MAP.NO_CHARACTERS' | translate }}</div>

      <button class="teleport-btn" (click)="visitPlanet()" [title]="'MAP.VIEW_PLANET' | translate">
        <ion-icon name="planet-outline"></ion-icon>
      </button>
    </div>

  </div>

</div>
