<div class="quest-tracker" *ngIf="(quests.active$ | async) as list">
  <ng-container *ngIf="list.length > 0">

    <!-- Botón para ocultar/mostrar la lista -->
    <button class="qt-toggle" (click)="toggle()"
            [title]="collapsed ? 'Mostrar misiones' : 'Ocultar misiones'">
      <ion-icon [name]="collapsed ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
      <span class="qt-toggle-count" *ngIf="collapsed">{{ list.length }}</span>
    </button>

    <div class="quest-tracker-inner" *ngIf="!collapsed">
      <div class="qt-row" *ngFor="let q of list" [class.qt-row--ready]="quests.isClaimable(q)">
        <ion-icon class="qt-icon" [name]="q.icon"></ion-icon>

        <!-- Misión de recogida: cada material con su contador (llevo/necesito) a la derecha. -->
        <ng-container *ngIf="q.objective.type === 'collect'; else genericTask">
          <div class="qt-reqs">
            <div class="qt-req" *ngFor="let c of collectItems(q)">
              <span class="qt-req-name">{{ c.name }}</span>
              <span class="qt-req-count" [class.qt-req-count--ok]="have(c.name) >= c.qty">{{ have(c.name) }}/{{ c.qty }}</span>
            </div>
          </div>
        </ng-container>

        <!-- Resto de misiones (incl. abrir el portal): tarea + contador de progreso. El
             contador 0/1 se oculta en 'openPortal' (es de acción, no de conteo). -->
        <ng-template #genericTask>
          <span class="qt-task">{{ (q.track || q.name) | translate }}</span>
          <ion-icon class="qt-ready" *ngIf="quests.isClaimable(q)" name="checkmark-circle"></ion-icon>
          <span class="qt-count" *ngIf="!quests.isClaimable(q) && q.objective.type !== 'openPortal'">{{ quests.progressOf(q) }}/{{ quests.goalOf(q) }}</span>
        </ng-template>
      </div>
    </div>

  </ng-container>
</div>
