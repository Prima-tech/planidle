<ion-content [fullscreen]="true">
  <div class="login-scene">
    <!-- Cielo nórdico: estrellas + aurora + montañas (pintado en login.page.ts). -->
    <canvas #sky class="sky"></canvas>

    <div class="login-layout">

      <div class="login-brand">
        <span class="runes">ᚹᚨᛚᚺᚨᛚᛚᚨ</span>
        <h1 class="game-title">Valhalla</h1>
        <span class="game-brand-sub">Idle RPG</span>
        <p class="game-subtitle">{{ 'LOGIN.TAGLINE' | translate }}</p>
      </div>

      <form class="stele" (ngSubmit)="login()">
        <h2 class="stele-title">{{ 'LOGIN.STELE_TITLE' | translate }}</h2>

        <div class="input-wrapper">
          <span class="input-rune">ᛗ</span>
          <ion-input [(ngModel)]="email" name="email" type="email" [placeholder]="'LOGIN.EMAIL_PLACEHOLDER' | translate" class="rune-input"></ion-input>
        </div>
        <div class="input-wrapper">
          <span class="input-rune">ᛉ</span>
          <ion-input [(ngModel)]="password" name="password" type="password" [placeholder]="'LOGIN.PASSWORD_PLACEHOLDER' | translate" class="rune-input"></ion-input>
        </div>

        <button type="submit" class="login-btn" [disabled]="loading">{{ 'LOGIN.BUTTON' | translate }}</button>

        <!-- Invitado = cuenta anónima en la NUBE. En modo Local (toggle ON) no aplica:
             se ocultan todas sus variantes para no contradecir la elección. -->
        <button type="button" *ngIf="!localMode && !guestId" class="guest-btn" (click)="loginAsGuest()" [disabled]="loading">
          {{ 'LOGIN.GUEST' | translate }}
        </button>

        <button type="button" *ngIf="!localMode && guestId" class="guest-btn guest-btn--resume" (click)="resumeGuest()" [disabled]="loading">
          <span>{{ 'LOGIN.GUEST_RESUME' | translate }}</span>
          <span class="guest-id">{{ guestId.slice(0, 8) }}</span>
        </button>

        <button type="button" *ngIf="!localMode && guestId" class="guest-new-link" (click)="loginAsGuest()" [disabled]="loading">
          {{ 'LOGIN.GUEST_NEW' | translate }}
        </button>

        <p class="login-error" *ngIf="error">{{ error }}</p>
      </form>

    </div>

    <!-- Toggles compactos: solo la palabra. ON = ese modo activo
         (Local ON = jugar en local · Admin ON = modo admin). -->
    <div class="mode-toggles">
      <div class="mode-toggle">
        <span class="mode-label">Local</span>
        <ion-toggle [(ngModel)]="localMode"></ion-toggle>
      </div>

      <div class="mode-toggle">
        <span class="mode-label">Admin</span>
        <ion-toggle [(ngModel)]="admin"></ion-toggle>
      </div>
    </div>

    <span class="app-version">v{{ appVersion }}</span>
  </div>
</ion-content>
